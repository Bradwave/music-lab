<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#141011"/>
  <rect x="2" y="2" width="28" height="28" fill="#1e1819" stroke="#3b2f31" stroke-width="2"/>
  <!-- Outer strobe rim -->
  <rect x="8" y="4" width="14" height="24" fill="#3a3233"/>
  <rect x="6" y="6" width="18" height="20" fill="#3a3233"/>
  <rect x="4" y="8" width="22" height="16" fill="#3a3233"/>
  <!-- Dark vinyl disc -->
  <rect x="9" y="5" width="12" height="22" fill="#100d0e"/>
  <rect x="7" y="7" width="16" height="18" fill="#100d0e"/>
  <rect x="5" y="9" width="20" height="14" fill="#100d0e"/>
  <!-- Subtle groove sheen -->
  <rect x="9" y="7" width="4" height="2" fill="#292123"/>
  <rect x="17" y="23" width="4" height="2" fill="#292123"/>
  <!-- White label & spindle -->
  <rect x="12" y="13" width="6" height="6" fill="#ede3cf"/>
  <rect x="14" y="15" width="2" height="2" fill="#1a1415"/>
  <!-- Dust flecks & smudge -->
  <rect x="8" y="12" width="2" height="2" fill="#e6b85c"/>
  <rect x="19" y="18" width="3" height="2" fill="#e6b85c"/>
  <rect x="10" y="20" width="2" height="1" fill="#ffe09a"/>
  <!-- Tonearm & crimson stylus LED -->
  <rect x="24" y="5" width="4" height="4" fill="#5e5052"/>
  <rect x="25" y="9" width="2" height="8" fill="#a89894"/>
  <rect x="23" y="17" width="2" height="4" fill="#a89894"/>
  <rect x="21" y="20" width="3" height="2" fill="#d94f5c"/>
</svg>
